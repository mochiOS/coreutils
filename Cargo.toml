[package]
name = "coreutils"
version = "0.1.0"
edition = "2024"

[workspace]

[patch.crates-io]
libc = { path = "../../libraries/libc" }

[dependencies]
libc = "0.2.185"
mochi-user-syscall = { path = "../../user/crates/syscall" }
mochios-capability-protocol = { path = "../../user/crates/capability-protocol" }
mochios-net-device-protocol = { path = "../../user/crates/net-device-protocol" }

[lib]
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
