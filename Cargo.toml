[package]
name = "coreutils"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
libc = { git = "https://github.com/mochiOS/libc", package = "libc" }
mboot-protocol = { git = "https://github.com/mochiOS/mBoot", rev = "54d223a845c0b97a9c5d6fc5c2908c04ffec1f68", package = "mboot-protocol" }
mnu-abi = { git = "https://github.com/mochiOS/mnu", package = "mnu-abi" }
mochi-user-platform = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-platform", default-features = false, features = ["std"] }
mochi-user-syscall = { git = "https://github.com/mochiOS/syscalls", package = "mochi-user-syscall" }
mochios-capability-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-capability-protocol" }
mochios-net-device-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-net-device-protocol" }
mochios-user-database = { git = "https://github.com/mochiOS/syscalls", package = "mochios-user-database" }
mochios-user-protocol = { git = "https://github.com/mochiOS/syscalls", package = "mochios-user-protocol" }

[lib]
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
